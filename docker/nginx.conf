server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed bundles and assets can be cached forever.
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-page app: every other path renders index.html and the router takes over.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    try_files $uri /index.html;
  }
}
